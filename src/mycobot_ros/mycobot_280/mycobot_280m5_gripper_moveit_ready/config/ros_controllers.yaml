# Simulation settings for using moveit_sim_controllers
moveit_sim_hw_interface:
  joint_model_group: arm_group
  joint_model_group_pose: init_pose
  joint_model_group: gripper
  joint_model_group_pose: open
# Settings for ros_control_boilerplate control loop
generic_hw_control_loop:
  loop_hz: 300
  cycle_time_error_threshold: 0.01
# Settings for ros_control hardware interface
hardware_interface:
  joints:
    - joint2_to_joint1
    - joint3_to_joint2
    - joint4_to_joint3
    - joint5_to_joint4
    - joint6_to_joint5
    - joint6output_to_joint6
    - gripper_controller
    - gripper_base_to_gripper_right3
  sim_control_mode: 1  # 0: position, 1: velocity
# Publish all joint states
# Creates the /joint_states topic necessary in ROS
joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 50

controller_list:
  - name: /firefighter/arm_controller
    action_ns: follow_joint_trajectory
    default: True
    type: FollowJointTrajectory
    joints:
    - joint2_to_joint1
    - joint3_to_joint2
    - joint4_to_joint3
    - joint5_to_joint4
    - joint6_to_joint5
    - joint6output_to_joint6

  - name: /firefighter/gripper_controller
    action_ns: follow_joint_trajectory
    default: True
    type: FollowJointTrajectory
    joints:
    - gripper_controller
    - gripper_base_to_gripper_right3

/firefihter/arm_controller:
  type: effort_controllers/JointTrajectoryController
  joints:
    - joint2_to_joint1
    - joint3_to_joint2
    - joint4_to_joint3
    - joint5_to_joint4
    - joint6_to_joint5
    - joint6output_to_joint6
  gains:
    joint2_to_joint1:
      p: 500
      d: 40
      i: 0
      i_clamp: 1
    joint3_to_joint2:
      p: 3000
      d: 0
      i: 0
      i_clamp: 1
    joint4_to_joint3:
      p: 1000
      d: 0
      i: 0
      i_clamp: 1
    joint5_to_joint4:
      p: 250
      d: 0
      i: 0
      i_clamp: 1
    joint6_to_joint5:
      p: 300
      d: 0
      i: 0
      i_clamp: 1
    joint6output_to_joint6:
      p: 100
      d: 0
      i: 0
      i_clamp: 1

/firefighter/gripper_controller:
  type: effort_controllers/JointTrajectoryController
  joints:
    - gripper_controller
    - gripper_base_to_gripper_right3
  gains:
    gripper_controller:
      p: 10
      d: 0
      i: 0
      i_clamp: 1
    gripper_base_to_gripper_right3:
      p: 10
      d: 0
      i: 0
      i_clamp: 1