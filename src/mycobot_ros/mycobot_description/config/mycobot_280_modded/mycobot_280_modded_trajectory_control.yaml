firefighter:
  /firefighter/arm_controller:
    type: effort_controllers/JointTrajectoryController
    joints:
      - joint2_to_joint1
      - joint3_to_joint2
      - joint4_to_joint3
      - joint5_to_joint4
      - joint6_to_joint5
      - joint6output_to_joint6
    contraints:
      goal_time: 0
      stopped_velocity_tolerances: 0
      joint2_to_joint1: {trajectory: 0.1, goal: 0.1}
      joint3_to_joint2: {trajectory: 0.1, goal: 0.1}
      joint4_to_joint3: {trajectory: 0.1, goal: 0.1}
      joint5_to_joint4: {trajectory: 0.1, goal: 0.1}
      joint6_to_joint5: {trajectory: 0.1, goal: 0.1}
      joint6output_to_joint6: {trajectory: 0.1, goal: 0.1}
    stop_trajectory_duration: 0
    state_publish_rate: 25
    action_monitor_rate: 10

  /firefighter/gripper_controller:
    type: effort_controllers/JointTrajectoryController
    joints:
      - gripper_left_controller
      - gripper_right_controller
    contraints:
      goal_time: 0
      stopped_velocity_tolerances: 0
      gripper_left_controller: {trajectory: 0.1, goal: 0.1}
      gripper_right_controller: {trajectory: 0.1, goal: 0.1}
    stop_trajectory_duration: 0
    state_publish_rate: 25
    action_monitor_rate: 10