firefighter:
  arm_controller:
    type: effort_controllers/JointTrajectoryController
    joints:
      - joint2_to_joint1
      - joint3_to_joint2
      - joint4_to_joint3
      - joint5_to_joint4
      - joint6_to_joint5
      - joint6output_to_joint6
    contraints:
      goal_time: 0.06
      stopped_velocity_tolerances: 0.1
      joint2_to_joint1: {trajectory: 0.1, goal: 0.1}
      joint3_to_joint2: {trajectory: 0.1, goal: 0.1}
      joint4_to_joint3: {trajectory: 0.1, goal: 0.1}
      joint5_to_joint4: {trajectory: 0.1, goal: 0.1}
      joint6_to_joint5: {trajectory: 0.1, goal: 0.1}
      joint6output_to_joint6: {trajectory: 0.1, goal: 0.1}
    stop_trajectory_duration: 0
    state_publish_rate: 25
    action_monitor_rate: 10

  gripper_controller:
    type: effort_controllers/JointTrajectoryController
    joints:
    - gripper_controller
    #- gripper_left3_to_gripper_left1
    #- gripper_base_to_gripper_right3
    #- gripper_right3_to_gripper_right1
    contraints:
      goal_time: 0.06
      stopped_velocity_tolerances: 0.1
      gripper_controller: {trajectory: 0.1, goal: 0.1}
      #gripper_left3_to_gripper_left1: {trajectory: 0.1, goal: 0.1}
      #gripper_base_to_gripper_right3: {trajectory: 0.1, goal: 0.1}
      #gripper_right3_to_gripper_right1: {trajectory: 0.1, goal: 0.1}
    stop_trajectory_duration: 0.06
    state_publish_rate: 25
    action_monitor_rate: 10

# Added the gripper joints to Bringup the moveit of mimic moveit pkg