tom:
  left_arm_controller:
    type: effort_controllers/JointTrajectoryController
    joints:
      - left_arm_ball_joint
      - left_arm_joint
      - left_forearm_joint
    contraints:
      goal_time: 0.6
      stopped_velocity_tolerances: 0.05
      left_arm_ball_joint: {trajectory: 0.1, goal: 0.1}
      left_arm_joint: {trajectory: 0.1, goal: 0.1}
      left_forearm_joint: {trajectory: 0.1, goal: 0.1}
    stop_trajectory_duration: 0.5
    state_publish_rate: 25
    action_monitor_rate: 10

  right_arm_controller:
    type: position_controllers/JointTrajectoryController
    joints:
      - right_arm_ball_joint
      - right_arm_joint
      - right_forearm_joint
    contraints:
      goal_time: 0.6
      stopped_velocity_tolerances: 0.05
      right_arm_ball_joint: {trajectory: 0.1, goal: 0.1}
      right_arm_joint: {trajectory: 0.1, goal: 0.1}
      right_forearm_joint: {trajectory: 0.1, goal: 0.1}
    stop_trajectory_duration: 0.5
    state_publish_rate: 25
    action_monitor_rate: 10

  head_controller:
    type: position_controllers/JointTrajectoryController
    joints:
      - head_joint
    contraints:
      goal_time: 0.6
      stopped_velocity_tolerances: 0.05
      head_joint: {trajectory: 0.1, goal: 0.1}
    stop_trajectory_duration: 0.5
    state_publish_rate: 25
    action_monitor_rate: 10